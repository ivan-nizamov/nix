[main]
font=Adwaita Sans:size=13
dpi-aware=auto
icon-theme=Papirus-Dark
icons-enabled=yes
terminal=kitty -e

# NGE interface-style layout
anchor=center
y-margin=120
width=64
lines=8
horizontal-pad=22
vertical-pad=18
inner-pad=14
line-height=24
letter-spacing=0
layer=overlay
match-mode=fzf
sort-result=yes
show-actions=yes
exit-on-keyboard-focus-loss=yes
placeholder=Search
prompt=""

[border]
width=2
radius=4
selection-radius=2

[colors]
# Active preset: NGE emergency red interface
background=120507f2
text=f6d8d0ff
prompt=ff2a1aff
placeholder=8e2a24ff
input=fff1e8ff
match=ffb000ff
selection=4a090bcc
selection-text=fff1e8ff
selection-match=ffcf42ff
counter=8e2a24ff
border=ff2a1aff

