# Kitty configuration

font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        16.0

cursor_shape underline
cursor_shape_unfocused hollow
cursor_blink_interval 0

# Trailing cursor effect
cursor_trail 150
cursor_trail_decay 0.08 0.28
cursor_trail_start_threshold 2

background_opacity 0.95
enable_audio_bell no

# Keep one theme include enabled; comment/uncomment to switch quickly.
# include themes/tokyo-night.conf
include themes/gruvbox-dark.conf
# include themes/nord.conf
