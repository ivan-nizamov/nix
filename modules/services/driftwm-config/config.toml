# driftwm configuration for thinkpad

autostart = ["waybar"]

# ── Input ─────────────────────────────────────────────────────

[input.keyboard]
layout = "us,ro"

[input.trackpad]
tap_to_click = true
natural_scroll = true

[input.mouse]
accel_profile = "flat"
natural_scroll = true
accel_speed = -0.176

# ── Keybindings ───────────────────────────────────────────────

[keybindings]
"mod+return" = "exec alacritty"
"mod+d" = "exec fuzzel"
"mod+q" = "close-window"
"mod+l" = "spawn swaylock -f -c 000000 -kl"
"mod+f" = "toggle-fullscreen"
"mod+m" = "fit-window"
"mod+shift+m" = "fit-window-snapped"
"mod+w" = "zoom-to-fit"
"mod+shift+w" = "zoom-to-fit-snapped"
"mod+a" = "home-toggle"
"mod+c" = "focus-center"
"mod+z" = "zoom-reset"
"mod+0" = "zoom-reset"
"mod+=" = "zoom-in"
"mod+-" = "zoom-out"
"mod+ctrl+shift+q" = "quit"
"mod+1" = "go-to -1750 1750"
"mod+2" = "go-to 1750 1750"
"mod+3" = "go-to 1750 -1750"
"mod+4" = "go-to -1750 -1750"

# ── Focus ─────────────────────────────────────────────────────

focus_follows_mouse = false

# ── Background ────────────────────────────────────────────────

[background]
type = "shader"

# ── Decorations ───────────────────────────────────────────────

[decorations]
font = "Adwaita Sans"
font_size = 11

# ── Cursor ────────────────────────────────────────────────────

[cursor]
theme = "macOS"
size = 24

# ── Window placement ──────────────────────────────────────────

window_placement = "center"

# ── Window rules ──────────────────────────────────────────────

[[window_rules]]
app_id = "Alacritty"
opacity = 0.85
blur = true
