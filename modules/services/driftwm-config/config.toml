# driftwm configuration for thinkpad-driftwm

autostart = [
  "swayidle -w timeout 600 'sh ~/.config/driftwm/scripts/lock.sh' before-sleep 'sh ~/.config/driftwm/scripts/lock.sh'",
]

# ── Input ─────────────────────────────────────────────────────

[input.keyboard]
layout = "us,ro"

[input.trackpad]
tap_to_click = true
natural_scroll = true

[input.mouse]
accel_profile = "flat"
natural_scroll = true
accel_speed = -0.176

# ── Keybindings ───────────────────────────────────────────────

[keybindings]
"mod+return" = "exec kitty"
"mod+space" = "spawn sh ~/.config/driftwm/scripts/window-search.sh"
"mod+d" = "exec fuzzel"
"mod+s" = "none"
"mod+l" = "spawn sh ~/.config/driftwm/scripts/lock.sh"
"mod+u" = "spawn mic-unmute"
"XF86AudioMicMute" = "spawn mic-toggle"
"mod+shift+c" = "reload-config"
"mod+q" = "close-window"
"mod+f" = "toggle-fullscreen"
"mod+m" = "fit-window"
"mod+shift+m" = "fit-window-snapped"
"mod+w" = "zoom-to-fit"
"mod+shift+w" = "zoom-to-fit-snapped"
"mod+a" = "home-toggle"
"mod+c" = "focus-center"
"mod+z" = "zoom-reset"
"mod+0" = "zoom-reset"
"mod+equal" = "zoom-in"
"mod+minus" = "zoom-out"
"mod+ctrl+shift+q" = "quit"

# ── Focus ─────────────────────────────────────────────────────

focus_follows_mouse = true

# ── Background ────────────────────────────────────────────────

[background]
type = "shader"

# ── Decorations ───────────────────────────────────────────────

[decorations]
font = "Adwaita Sans"
font_size = 11

# ── Cursor ────────────────────────────────────────────────────

[cursor]
theme = "macOS"
size = 24

# ── Window placement ──────────────────────────────────────────

window_placement = "auto"

# ── Navigation ────────────────────────────────────────────────

[navigation]
anchors = []

# ── Window rules ──────────────────────────────────────────────

[[window_rules]]
app_id = "Alacritty"
opacity = 0.85
blur = true
